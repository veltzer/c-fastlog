# rsconstruct build configuration for this repository.

[build]
# src_dirs entries name directories; "." (the whole tree) is a config error
reject_dot_src_dirs = true

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

[processor.generator.tera]
src_dirs = ["tera.templates"]

[processor.checker.ruff]
src_dirs = ["src", "scripts", "config"]


[processor.checker.pyrefly]
src_dirs = ["src", "scripts", "config"]

[processor.checker.iluacheck]
src_dirs = ["config"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.checker.taplo]
src_files = [".rumdl.toml", "pyproject.toml", "rsconstruct.toml"]

# The Makefile compiled src/**/*.c (-fpic) into out/lib/libfastlog.so, then
# built each test/*.c against that library (-lfastlog -lpthread). That is a
# multi-object shared-library link with a lib-before-tests order, which the
# single-file C processor cannot express, so scripts/build_fastlog.py runs the
# exact sequence. The .c/.h sources are the inputs so a change retriggers it.
[processor.explicit.generic.fastlog]
command = "scripts/build_fastlog.py"
input_globs = ["src/**/*.c", "src/**/*.h", "test/*.c"]
output_files = [
    "out/lib/libfastlog.so",
    "out/bin/fastlog_test_basic",
    "out/bin/fastlog_test_speed",
    "out/bin/fastlog_test_crash",
]

# us_helper.h includes cpufreq.h, provided by libcpufreq-dev.
[dependencies]
system = [
    "libcpufreq-dev",
]

# lint the YAML files with yamllint (policy: .yamllint.yaml)
[processor.checker.iyamllint]
src_dirs = [".github"]
src_files = [".yamllint.yaml"]

# lint the GitHub Actions workflow files with actionlint
[processor.checker.iactionlint]
src_dirs = [".github/workflows"]

# audit the GitHub Actions workflow files for security problems with zizmor
# (policy: .github/zizmor.yml)
[processor.checker.zizmor]
src_dirs = [".github/workflows"]
# The pedantic persona: also the findings zizmor's default persona keeps
# quiet (undocumented permissions, template expansion of any context,
# unnamed jobs, ...). --offline and --no-progress are the default args.
args = ["--offline", "--no-progress", "--persona=pedantic"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.checker.rumdl]
src_files = ["README.md"]

# ─── c / c++ ─────────────────────────────────────────────────────────────────

# one library (src) plus the test programs that call it: one run over everything so the API has callers
[processor.checker.cppcheck]
batch = true
src_dirs = ["src", "test"]
args = [
	"--error-exitcode=1",
	"--enable=warning,style,performance,portability,information,unusedFunction",
	"--check-level=exhaustive",
	"--inline-suppr",
]

# ─── html ────────────────────────────────────────────────────────────────────

[processor.checker.itidy]
src_dirs = ["docs"]
