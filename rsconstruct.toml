# rsconstruct build configuration for this repository.

[build]
# src_dirs entries name directories; "." (the whole tree) is a config error
reject_dot_src_dirs = true

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

# Convention: tera configs are Lua (config/*.lua). Every dep_auto entry
# listed here must exist: rsconstruct rejects a missing one at config load.
# Repos still on config/*.py keep a dep_inputs override in their local
# overlay until converted.
[processor.tera]
dep_auto = [
	"config/project.lua",
	"config/personal.lua",
	"config/version.lua",
]
src_dirs = ["tera.templates"]
dep_inputs = [
    "config/project.lua",
    "config/personal.lua",
    "config/version.lua",
]

[processor.ruff]
src_dirs = ["src", "scripts", "config"]

[processor.pylint]
src_dirs = ["src", "scripts", "config"]

[processor.mypy]
src_dirs = ["src", "scripts", "config"]

[processor.luacheck]
src_dirs = ["config"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_files = [".rumdl.toml", "pyproject.toml", "rsconstruct.toml"]

# The Makefile compiled src/**/*.c (-fpic) into out/lib/libfastlog.so, then
# built each test/*.c against that library (-lfastlog -lpthread). That is a
# multi-object shared-library link with a lib-before-tests order, which the
# single-file C processor cannot express, so scripts/build_fastlog.py runs the
# exact sequence. The .c/.h sources are the inputs so a change retriggers it.
[processor.explicit.fastlog]
command = "scripts/build_fastlog.py"
input_globs = ["src/**/*.c", "src/**/*.h", "test/*.c"]
output_files = [
    "out/lib/libfastlog.so",
    "out/bin/fastlog_test_basic",
    "out/bin/fastlog_test_speed",
    "out/bin/fastlog_test_crash",
]

# us_helper.h includes cpufreq.h, provided by libcpufreq-dev.
[dependencies]
system = [
    "libcpufreq-dev",
]

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.rumdl]
src_files = ["README.md"]

# ─── c / c++ ─────────────────────────────────────────────────────────────────

[processor.cppcheck]
src_dirs = ["src", "test"]
args = [
	"--error-exitcode=1",
	"--enable=warning,style,performance,portability",
	"--inline-suppr",
]

# ─── html ────────────────────────────────────────────────────────────────────

[processor.htmlhint]
src_dirs = ["docs"]
